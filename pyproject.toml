[project]
name = "python-tg-bot-template"
version = "0.1.0"
description = "Canonical BreadthFirst Python Telegram bot service template"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic-settings>=2.10,<3",
    "python-telegram-bot>=21.10,<23",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["__main__.py", "app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
